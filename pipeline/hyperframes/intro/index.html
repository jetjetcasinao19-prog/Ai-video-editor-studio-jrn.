<!doctype html>
<html lang="en"
  data-composition-variables='[{"id":"title","type":"string","label":"Title","default":"My video"},{"id":"subtitle","type":"string","label":"Subtitle","default":""},{"id":"bg","type":"string","label":"Background","default":"#0b0e14"},{"id":"ink","type":"string","label":"Text","default":"#ffffff"},{"id":"accent","type":"string","label":"Accent","default":"#ffe600"}]'>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=__W__, height=__H__">
<!-- 2.5 s animated title card used by pipeline/edit.mjs (__W__/__H__ are filled in). -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"Montserrat";font-weight:800;src:url("fonts/Montserrat.ttf") format("truetype")}
:root{--ground:#0b0e14;--ink:#ffffff;--accent:#ffe600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:__W__px;height:__H__px;overflow:hidden;background:var(--ground)}
#root{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
 font-family:"Montserrat",sans-serif;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--ground) 70%,#ffffff 18%) 0%,var(--ground) 70%)}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#bar{width:18%;height:calc(__W__px * 0.012);background:var(--accent);border-radius:99px;margin-bottom:calc(__W__px * 0.05)}
#title{color:var(--ink);font-weight:800;font-size:calc(__W__px * 0.085);line-height:1.08;text-align:center;
 padding:0 8%;letter-spacing:-0.02em;overflow-wrap:anywhere}
#subtitle{color:color-mix(in srgb,var(--ink) 78%,var(--ground));font-weight:800;font-size:calc(__W__px * 0.04);margin-top:calc(__W__px * 0.04);text-align:center;padding:0 10%}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2.5" data-width="__W__" data-height="__H__">
 <div id="card" class="clip" data-start="0" data-duration="2.5" data-track-index="0">
  <div id="bar"></div>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
 </div>
</div>
<script>
const v=(window.__hyperframes&&window.__hyperframes.getVariables&&window.__hyperframes.getVariables())||{};
const hex=c=>/^#[0-9a-fA-F]{6}$/.test(c||"");
const rs=document.documentElement.style;
if(hex(v.bg)) rs.setProperty("--ground",v.bg);
if(hex(v.ink)) rs.setProperty("--ink",v.ink);
if(hex(v.accent)) rs.setProperty("--accent",v.accent);
document.getElementById("title").textContent=v.title||"My video";
const sub=document.getElementById("subtitle");
sub.textContent=v.subtitle||"";
if(!v.subtitle) sub.style.display="none";
const tl=gsap.timeline({paused:true});
tl.fromTo("#bar",{scaleX:0,opacity:0},{scaleX:1,opacity:1,duration:0.45,ease:"power3.out"},0.05)
  .fromTo("#title",{y:60,opacity:0,filter:"blur(10px)"},{y:0,opacity:1,filter:"blur(0px)",duration:0.6,ease:"power4.out"},0.15)
  .fromTo("#subtitle",{y:30,opacity:0},{y:0,opacity:1,duration:0.5,ease:"power3.out"},0.45)
  .to("#root",{opacity:0,duration:0.35,ease:"power2.in"},2.15);
window.__timelines["main"]=tl;
tl.seek(0);
</script>
</body>
</html>
