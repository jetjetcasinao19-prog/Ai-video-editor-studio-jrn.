# Publishes the editor (index.html, stickman.html, story.html and their files)
# to GitHub Pages WITHOUT the big submodules (omniroute/, remotion/), which
# GitHub's default Pages builder would download (1.5 GB) and fail on.
# animate/ (code-animated shorts, server side) is left out like pipeline/.
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy editor to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Collect the site files (no submodules, no server pipeline)
        run: |
          mkdir _site
          tar -cf - --exclude=./.git --exclude=./.github --exclude=./_site \
            --exclude=./omniroute --exclude=./remotion --exclude=./google-flow-mcp \
            --exclude=./pipeline --exclude=./animate --exclude=node_modules --exclude=./output --exclude=./inbox . | tar -xf - -C _site
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
