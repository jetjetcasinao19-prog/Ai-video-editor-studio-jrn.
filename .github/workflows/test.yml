name: Test editor

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pipeline
        working-directory: pipeline
        run: npm ci
      - name: "Edit this" pipeline test
        working-directory: pipeline
        run: npm test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Editor tests
        run: node tests/editor.test.js
      - name: Projects test
        run: node tests/projects.test.js
      - name: MP4 export test (Google Chrome, like Chrome on Android)
        env:
          PW_CHANNEL: chrome
        run: node tests/mp4-export.test.js
      - name: AI assistant test
        run: node tests/assistant.test.js
      - name: Templates test
        run: node tests/templates.test.js
      - name: Background music test
        run: node tests/music.test.js
      - name: Transitions test
        run: node tests/transitions.test.js
      - name: Scene detection test
        run: node tests/scene-detection.test.js
      - name: Subtitle styling test
        run: node tests/caption-style.test.js
      - name: AI captions test (downloads Whisper Tiny, ~41 MB)
        env:
          PW_CHANNEL: chrome
        run: node tests/ai-captions.test.js
